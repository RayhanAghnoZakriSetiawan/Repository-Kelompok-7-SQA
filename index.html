<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        .smiley {
            width: 150px;
            height: 150px;
            background: #FFD700;
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .eye {
            width: 20px;
            height: 30px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 50px;
        }
        
        .eye-left {
            left: 40px;
        }
        
        .eye-right {
            right: 40px;
        }
        
        .mouth {
            width: 60px;
            height: 30px;
            border: 4px solid #333;
            border-top: none;
            border-radius: 0 0 60px 60px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        h1 {
            color: #333;
            font-size: 48px;
            margin: 0;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="smiley">
            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>
            <div class="mouth"></div>
        </div>
        <h1>Hello World</h1>
    </div>
</body>
</html>
